name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native and managed application
        shell: pwsh
        run: ./build.ps1
      - name: Run isolated development regression checks
        shell: pwsh
        run: |
          $validation = Start-Process -FilePath ./artifacts/NewStart.exe -ArgumentList '--verify-development' -WindowStyle Hidden -PassThru
          if (-not $validation.WaitForExit(60000)) { Stop-Process -Id $validation.Id; throw 'Regression checks timed out.' }
          if ($validation.ExitCode -ne 0) { Get-Content ./artifacts/development-verification.json; throw 'Regression checks failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: New-Start-0.1.0-beta.1-windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.dll
            artifacts/NewStart.deps.json
            artifacts/NewStart.runtimeconfig.json
            artifacts/LICENSE
            artifacts/NOTICE
