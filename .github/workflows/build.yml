name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native and managed application
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: New-Start-windows-x64-preview
          path: |
            artifacts/*.exe
            artifacts/*.dll
            artifacts/*.json
            artifacts/LICENSE
            artifacts/NOTICE
